# TEMPORÁRIO (D-116): envia os vídeos da página Matrícula Escolar da SMEDU ao Storage da produção.
# Existe só no branch carga-videos-smedu, que é apagado depois do envio.
name: Carga temporária de vídeos
on:
  push:
    branches: [carga-videos-smedu]
permissions:
  contents: read
jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ID_PRODUCAO }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SEGREDO_PRODUCAO }}
      AWS_DEFAULT_REGION: sa-east-1
      S3: https://qgywucdnaeheqndcxtho.storage.supabase.co/storage/v1/s3
      PASTA: 3af0d4ae-d118-468f-8f8a-8cdaae780488/videos
    steps:
      - uses: actions/checkout@v4
      - name: Enviar
        run: |
          set -euo pipefail
          for f in carga/*; do
            case "$f" in *.mp4) t=video/mp4 ;; *.jpg) t=image/jpeg ;; *) continue ;; esac
            aws s3 cp "$f" "s3://midias/$PASTA/$(basename "$f")" --endpoint-url "$S3" --content-type "$t" --cache-control "public, max-age=31536000" --only-show-errors
            echo "enviado: $PASTA/$(basename "$f")"
          done
